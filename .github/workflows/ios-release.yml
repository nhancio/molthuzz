name: iOS Release (GitHub Actions + EAS Sync)

on:
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Build runner (github-local bypasses EAS cloud quota; eas-cloud uses EAS after Dec 1)"
        required: true
        default: github-local
        type: choice
        options:
          - github-local
          - eas-cloud

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICES_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICES_INFO_PLIST_B64" | base64 --decode > GoogleService-Info.plist
          fi

      - name: Build & Submit via EAS Cloud
        if: ${{ inputs.runner_mode == 'eas-cloud' }}
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait

      - name: Ensure fastlane & CocoaPods
        if: ${{ inputs.runner_mode == 'github-local' }}
        run: |
          which pod || brew install cocoapods
          which fastlane || brew install fastlane

      - name: Build signed iOS IPA locally on GitHub macOS
        if: ${{ inputs.runner_mode == 'github-local' }}
        env:
          EAS_NO_VCS: "1"
        run: |
          mkdir -p artifacts
          eas build --platform ios --profile production --local --non-interactive --output artifacts/MakeIn-ios.ipa

      - name: Submit IPA to App Store Connect / TestFlight
        if: ${{ inputs.runner_mode == 'github-local' }}
        env:
          EAS_NO_VCS: "1"
        run: |
          eas submit --platform ios --profile production --path artifacts/MakeIn-ios.ipa --non-interactive --wait
